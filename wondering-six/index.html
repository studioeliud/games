<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#080d14">
    <title>The Wondering Six | ELIUD GAMES</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #080d14;
      }
      #unity-container.unity-desktop,
      #unity-container.unity-mobile {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        transform: none;
      }
      #unity-canvas,
      #unity-canvas.unity-mobile {
        width: 100% !important;
        height: 100% !important;
        background: #080d14;
      }
      #unity-footer { display: none; }
      #back-home {
        position: fixed;
        left: max(12px, env(safe-area-inset-left));
        bottom: max(12px, env(safe-area-inset-bottom));
        z-index: 30;
        padding: 8px 12px;
        border: 1px solid rgba(255,255,255,.2);
        border-radius: 999px;
        color: rgba(255,255,255,.82);
        background: rgba(8,13,20,.72);
        backdrop-filter: blur(10px);
        font: 700 12px/1.2 system-ui, sans-serif;
        text-decoration: none;
      }
      #back-home:hover { color: #fff; border-color: rgba(255,255,255,.45); }
      #rotate-hint {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #fff;
        background: #080d14;
        font: 700 18px/1.5 system-ui, sans-serif;
        text-align: center;
      }
      @media (orientation: landscape) {
        #rotate-hint { display: none; }
      }
    </style>
  </head>
  <body>
    <a id="back-home" href="../" aria-label="ELIUD GAMES 홈으로">← ELIUD GAMES</a>
    <div id="rotate-hint">가로 화면으로 돌려서 플레이해 주세요.</div>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">The Wondering Six</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var buildVersion = "20260731-223516";
      var buildQuery = "?v=" + encodeURIComponent(buildVersion);
      var loaderUrl = buildUrl + "/WebGL.loader.js" + buildQuery;
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb" + buildQuery,
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb" + buildQuery,
        codeUrl: buildUrl + "/WebGL.wasm.unityweb" + buildQuery,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Wondering Six",
        productName: "The Wondering Six",
        productVersion: buildVersion,
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        config.devicePixelRatio = Math.min(
          Math.max(window.devicePixelRatio || 1, 1.25),
          1.5
        );
      } else {
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
